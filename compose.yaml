services:
  db:
    image: postgres:18.3-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sde_admin}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?Set MIGRATOR_PASSWORD}
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - ./deploy/roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
      - postgres_data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

  migrate:
    image: ${COMPOSE_PROJECT_NAME:-security-detection-engine}-app:local
    build: .
    environment:
      SDE_DATABASE_URL: postgresql+psycopg://sde_migrator@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      PGPASSWORD: ${MIGRATOR_PASSWORD:?Set MIGRATOR_PASSWORD}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: ${COMPOSE_PROJECT_NAME:-security-detection-engine}-app:local
    build: .
    environment:
      SDE_DATABASE_URL: postgresql+psycopg://sde_runtime@db:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      PGPASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD}
      SDE_MAX_REQUEST_BODY_BYTES: ${SDE_MAX_REQUEST_BODY_BYTES:-5242880}
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - backend
      - frontend
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).close()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  postgres_data:

networks:
  backend:
    internal: true
  frontend:
